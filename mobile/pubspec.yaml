name: agritrace_mobile
description: AgriTrace — application Android de terrain, hors connexion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.3                # empreinte du certificat du serveur de la coopérative (HTTPS épinglé)
  sqflite_sqlcipher: ^3.1.0+1   # SQLite chiffré (protection des données locales)
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5
  uuid: ^4.5.0
  decimal: ^3.0.2               # estimation locale sans flottants
  intl: ^0.19.0
  image_picker: ^1.1.2          # photo du reçu d'achat
  geolocator: ^13.0.1           # position GPS pour le relevé du tracé des parcelles
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/agritrace-logo.png
    - assets/ci-geo.json
