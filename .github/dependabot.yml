# Mises à jour automatiques des dépendances (correctifs de sécurité compris), une demande par composant et par semaine.
version: 2
updates:
  - { package-ecosystem: npm, directory: /backend, schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: npm, directory: /web, schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: npm, directory: /desktop, schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: pub, directory: /mobile, schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /backend, schedule: { interval: weekly } }
