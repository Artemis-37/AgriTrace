name: Application Android
# Compile l'APK (release) et le publie en artefact. Lancement manuel : onglet Actions → « Application Android » → Run workflow,
# en indiquant l'adresse de votre serveur (api_base). Sans clé de signature, l'APK est signé avec la clé de débogage :
# suffisant pour l'installer sur des téléphones de test, PAS pour le Play Store (voir docs/DEPOT_ET_COMPILATION.md).
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Adresse de l'API (ex. https://api.ma-cooperative.org/v1)"
        required: true
        default: 'https://api.agritrace.example/v1'
      version:
        description: 'Version affichée'
        required: true
        default: '0.1.0'
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org ci.agritrace .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Clé de signature de production (secrets du dépôt ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "::warning::Pas de clé de production : APK signé avec la clé de débogage, à ne pas distribuer"; fi
      - name: "Compilation de l'APK (2 essais, le téléchargement du NDK échoue parfois)"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          B="--release --dart-define=API_BASE=${{ inputs.api_base }} --dart-define=APP_VERSION=${{ inputs.version }}"
          flutter build apk $B || (rm -rf $ANDROID_HOME/ndk && flutter build apk $B)
      - uses: actions/upload-artifact@v4
        with: { name: agritrace-apk, path: mobile/build/app/outputs/flutter-apk/app-release.apk }
