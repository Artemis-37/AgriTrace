name: Application Android
# Compile l'APK (release) et le publie en artefact, branché sur VOTRE serveur Render de test :
#  1. Dépôt GitHub → Settings → Secrets and variables → Actions → onglet « Variables » → New repository variable
#     nom : RENDER_URL   valeur : l'adresse du service Render, sans /v1 (à défaut, https://agritrace-pe24.onrender.com est utilisée)
#  2. L'APK se compile alors tout seul à chaque mise à jour du dossier mobile/ ; ou à la main : onglet Actions → « Application Android » → Run workflow
#     (api_base facultatif : il remplace RENDER_URL). Sans clé de signature, l'APK est signé avec la clé de débogage :
# suffisant pour l'installer sur des téléphones de test, PAS pour le Play Store (voir docs/DEPOT_ET_COMPILATION.md).
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  workflow_dispatch:
    inputs:
      api_base:
        description: "Adresse de l'API, facultatif (sinon : variable RENDER_URL + /v1)"
        required: false
        default: ''
      version:
        description: 'Version affichée'
        required: false
        default: ''
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v7
      - name: Adresse du serveur Render (réveille le service gratuit, vérifie qu'il répond)
        env:
          INPUT_API: ${{ inputs.api_base }}
          RENDER_URL: ${{ vars.RENDER_URL || 'https://agritrace-pe24.onrender.com' }}
          INPUT_VER: ${{ inputs.version }}
        run: |
          API="$INPUT_API"
          if [ -z "$API" ] && [ -n "$RENDER_URL" ]; then API="${RENDER_URL%/}/v1"; fi
          if [ -z "$API" ]; then echo "::error::Aucune adresse de serveur : créez la variable de dépôt RENDER_URL (ex. https://agritrace-xxxx.onrender.com) ou renseignez api_base"; exit 1; fi
          echo "API_BASE_URL=$API" >> "$GITHUB_ENV"
          echo "APP_VER=${INPUT_VER:-0.1.${{ github.run_number }}}" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5 6; do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${API%/v1}/v1/health" || true); echo "essai $i : HTTP $code"; [ "$code" = 200 ] && break; sleep 20; done
          [ "$code" = 200 ] || echo "::warning::Le serveur ne répond pas encore (200 attendu) : l'APK est compilé quand même, mais vérifiez le déploiement Render"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org ci.agritrace .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Clé de signature de production (secrets du dépôt ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "::warning::Pas de clé de production : APK signé avec la clé de débogage, à ne pas distribuer"; fi
      - name: "Compilation de l'APK (2 essais, le téléchargement du NDK échoue parfois)"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          B="--release --dart-define=API_BASE=$API_BASE_URL --dart-define=APP_VERSION=$APP_VER"
          flutter build apk $B || (rm -rf $ANDROID_HOME/ndk && flutter build apk $B)
      - uses: actions/upload-artifact@v4
        with: { name: agritrace-apk, path: mobile/build/app/outputs/flutter-apk/app-release.apk }
