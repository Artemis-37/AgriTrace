name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4   # PostGIS actif : le moteur géospatial SQL est exercé par tous les parcours
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: agritrace }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner -d agritrace" --health-interval 5s --health-retries 10
    env:
      OWNER_URL: postgres://owner:owner@localhost:5432/agritrace
      DATABASE_URL: postgres://agritrace_app:app@localhost:5432/agritrace
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DOCUMENTS_DIR: /tmp/agritrace-docs
      PORT: 3000
      API: http://localhost:3000/v1
      ADMIN_EMAIL: admin@agritrace.test
      ADMIN_PASSWORD: MotDePasseAdmin2026!
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Rôle applicatif (non propriétaire) puis migrations
        run: |
          PGPASSWORD=owner psql -h localhost -U owner -d agritrace -v ON_ERROR_STOP=1 -c "CREATE ROLE agritrace_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS" \
            -c "GRANT USAGE ON SCHEMA public TO agritrace_app" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE owner IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO agritrace_app" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE owner IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO agritrace_app" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE owner IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO agritrace_app"
          DATABASE_URL=$OWNER_URL node scripts/migrate.js
          DATABASE_URL=$OWNER_URL ADMIN_PASSWORD=$ADMIN_PASSWORD node scripts/create-platform-admin.js $ADMIN_EMAIL "Admin CI"
      - name: Démarrer l'API
        run: |
          THROTTLE_LIMIT=100000 LOGIN_THROTTLE_LIMIT=100000 node dist/main > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/v1/ready && break; sleep 1; done
          curl -fs http://localhost:3000/v1/ready
      - run: npm run test:e2e
      - name: Moteur de repli sans PostGIS (GEO_ENGINE=js) — mêmes classements
        run: |
          PORT=3001 GEO_ENGINE=js THROTTLE_LIMIT=100000 LOGIN_THROTTLE_LIMIT=100000 node dist/main > /tmp/api-js.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3001/v1/ready && break; sleep 1; done
          API=http://localhost:3001/v1 EXPECT_ENGINE=js node scripts/e2e-postgis.js
          API=http://localhost:3001/v1 EXPECT_ENGINE=js node scripts/e2e-zones-protegees.js
          API=http://localhost:3001/v1 node scripts/e2e-geo.js
      - name: Sécurité (API en mode production, limites de connexion par défaut)
        run: |
          NODE_ENV=production TRUST_PROXY=1 JWT_SECRET=Zq8vK2mXr4Tn7LpA9sWd3YhB6cEj1UfG DOCUMENTS_KEY=$(openssl rand -base64 32) PORT=3003 THROTTLE_LIMIT=100000 node dist/main > /tmp/api-sec.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3003/v1/ready && break; sleep 1; done
          API=http://localhost:3003/v1 node scripts/e2e-securite.js
          API=http://localhost:3003/v1 node scripts/e2e-2fa.js
      - name: Portail web (build, aperçu relié à l'API) et navigateur
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright-core install --with-deps chromium
          VITE_API_PROXY=http://localhost:3000 npx vite preview --port 4173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4173/ > /dev/null && break; sleep 1; done
          WEB=http://localhost:4173 npm run test:ui
      - name: Capture en cas d'échec du parcours navigateur
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-echec, path: web/e2e-echec.png, if-no-files-found: ignore }
      - name: Journal de l'API en cas d'échec
        if: failure()
        run: tail -n 100 /tmp/api.log

  desktop-serveur:
    # Serveur local de coopérative : PostgreSQL embarqué + API + portail, démarrage à froid, premier démarrage dans le navigateur, sauvegarde, redémarrage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: backend
      - run: npm ci && npm run build && npx playwright-core install --with-deps chromium
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - name: Orchestration (démarrage, migrations, données, sauvegarde, redémarrage)
        run: node test/orchestration.js ..
        working-directory: desktop
      - name: Premier démarrage dans le navigateur
        working-directory: desktop
        run: |
          ONLY_START=1 TEST_PORT=3150 node test/orchestration.js .. > /tmp/srv.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3151/v1/mode > /dev/null && break; sleep 1; done
          cd ../web && WEB=http://127.0.0.1:3151 node e2e/parcours-premier-demarrage.mjs
      - name: Poste client Electron (serveur éteint, redémarrage hors connexion, rejeu au retour)
        working-directory: desktop
        run: |
          npm ci
          xvfb-run -a node test/client-electron.js ..
      - name: Journal en cas d'échec
        if: failure()
        run: tail -n 60 /tmp/srv.log || true

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org ci.agritrace .
      - name: Supprimer le test d'exemple généré (il référence une classe MyApp qui n'existe pas ici)
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: "Compilation de l'APK (debug, 2 essais, le téléchargement du NDK échoue parfois)"
        run: flutter build apk --debug || (rm -rf $ANDROID_HOME/ndk && flutter build apk --debug)

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agritrace-api ./backend
      - run: docker build -t agritrace-web ./web
