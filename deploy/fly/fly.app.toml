# Application : API + portail web. Le nom doit être unique sur Fly (adresse : https://<nom>.fly.dev).
app = "REMPLACER-agritrace"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.app"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRUST_PROXY = "1"
  LOG_REQUESTS = "true"
  # Essai avec les comptes de démonstration : double authentification désactivée. À remettre à "true" ensuite.
  REQUIRE_2FA = "false"

[deploy]
  # Migrations de la base à chaque déploiement (avec le compte propriétaire, secret OWNER_DATABASE_URL).
  release_command = "sh -c 'DATABASE_URL=$OWNER_DATABASE_URL node scripts/migrate.js'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[mounts]]
  source = "documents"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
