# Application : API + portail web. Le nom doit être unique sur Fly (adresse : https://<nom>.fly.dev).
app = "agritrace-nr7o4a"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRUST_PROXY = "1"
  LOG_REQUESTS = "true"
  # Essai avec les comptes de démonstration : double authentification désactivée. À remettre à "true" ensuite.
  REQUIRE_2FA = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
