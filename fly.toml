# fly.toml app configuration file generated for agritrace on 2026-10-25T14:29:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agritrace'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  LOG_REQUESTS = 'true'
  NODE_ENV = 'production'
  PORT = '3000'
  REQUIRE_2FA = 'false'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
