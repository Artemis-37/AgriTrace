<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>AgriTrace — installation</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
 body{font:15px/1.5 "Segoe UI",system-ui,sans-serif;margin:0;padding:28px 34px;background:#efebe1;color:#2e3832}
 h1{margin:0 0 4px;font-size:26px}h1 span{color:#35614e}p.sub{margin:0 0 22px;color:#566}
 label.opt{display:block;background:#f8f5ec;border:2px solid #ddd6c5;border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
 label.opt:has(input:checked){border-color:#35614e;background:#e8efe3}
 label.opt b{display:block}label.opt small{color:#566}
 input[type=text]{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #bbb;border-radius:6px;font:inherit;margin-top:8px}
 button{background:#35614e;color:#fff;border:0;border-radius:8px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
 button:disabled{opacity:.5;cursor:default}.msg{margin-top:10px;font-size:14px}.bad{color:#b3261e}.good{color:#1e7a2f}
</style></head><body>
<h1>Agri<span>Trace</span></h1><p class="sub">Comment ce poste doit-il fonctionner ?</p>
<label class="opt"><input type="radio" name="role" value="single" checked> <b>Poste unique</b>
 <small>Un seul ordinateur : les données restent ici et aucun autre poste ne s'y connecte. Vous pourrez passer en serveur plus tard.</small></label>
<label class="opt"><input type="radio" name="role" value="server"> <b>Ce poste est le serveur de la coopérative</b>
 <small>Les données sont stockées ici. Les autres ordinateurs du bureau s'y connectent. Ce poste doit rester allumé aux heures de travail. Aucun accès Internet n'est nécessaire pour travailler.</small></label>
<label class="opt"><input type="radio" name="role" value="client"> <b>Poste client</b>
 <small>Pour les autres ordinateurs du bureau : ce poste ne garde pas les données ; il se connecte au serveur de la coopérative, trouvé automatiquement (bouton « Rechercher sur le réseau »). Si le serveur est éteint, ce poste continue de fonctionner et envoie son travail à son retour ; les postes peuvent s'écrire entre eux.</small>
 <div id="urlbox" hidden><button type="button" id="find" style="margin-top:8px">Rechercher sur le réseau</button><div class="msg" id="msg"></div>
 <details style="margin-top:8px"><summary style="cursor:pointer;color:#566;font-size:13px">Le serveur n'est pas trouvé ? (réservé au technicien)</summary>
 <input type="text" id="url" placeholder="Nom ou adresse du poste serveur" spellcheck="false"></details></div></label>
<label style="display:block;margin:6px 0 4px">Nom de ce poste <small style="color:#66706a">(ex. Comptabilité, Magasin, Bureau du directeur)</small></label>
<input type="text" id="station" placeholder="Poste 1" spellcheck="false" maxlength="40">
<button id="go">Continuer</button>
<script>
 const $=(i)=>document.getElementById(i);
 const sync=()=>{const c=document.querySelector('input[name=role]:checked').value==='client';$('urlbox').hidden=!c};
 document.querySelectorAll('input[name=role]').forEach(r=>r.addEventListener('change',sync));
 $('find').onclick=()=>$('go').click();
 $('go').onclick=async()=>{
  const role=document.querySelector('input[name=role]:checked').value;
  const station=$('station').value.trim()||(role==='client'?'Poste':'Serveur');
  if(role!=='client'){await window.agritrace.choose({role,stationName:station});return}
  $('go').disabled=true;$('msg').className='msg';$('msg').textContent='Recherche du serveur de la coopérative…';
  let r=await window.agritrace.discover();
  const manual=$('url').value.trim();
  if(!r.ok&&manual){let u=manual;if(!/^https?:\/\//.test(u))u='http://'+u;if(!/:\d+$/.test(u))u+=':3000';r=await window.agritrace.check(u)}
  $('go').disabled=false;
  if(!r.ok){$('msg').className='msg bad';$('msg').textContent='Aucun serveur trouvé. Vérifiez que le poste serveur est allumé avec AgriTrace ouvert et que vous êtes sur le même réseau (câble ou Wi-Fi du bureau), puis réessayez.';$('urlbox').querySelector('details').open=false;return}
  $('msg').className='msg good';$('msg').textContent='Serveur de la coopérative trouvé. Connexion…';
  await window.agritrace.choose({role:'client',serverUrl:r.origin,stationName:station});
 };
</script></body></html>
