services:
  db:
    image: postgis/postgis:16-3.4   # PostgreSQL 16 + PostGIS (moteur géospatial ; le calcul par l'application reste le repli)
    environment:
      POSTGRES_USER: agritrace
      POSTGRES_PASSWORD: agritrace
      POSTGRES_DB: agritrace
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
