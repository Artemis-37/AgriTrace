<!doctype html><html lang="fr"><head><meta charset="utf-8"><script src="timeline.js"></script><script src="seq.js"></script><style>
:root{--g9:#1d3a2c;--g8:#2b5240;--g6:#4c7a5c;--cream:#f2eee4;--ink:#25332b;--mute:#5d6b62;--amber:#d4a24c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:'Poppins',sans-serif}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden;display:none}
.dark{background:radial-gradient(ellipse at 30% 20%,#2f5a45 0,#1d3a2c 60%,#152c21 100%);color:#f6f3ea}
.light{background:var(--cream);color:var(--ink)}
.abs{position:absolute}
h1{font-weight:600;letter-spacing:-.02em;line-height:1.12}
.amber{color:var(--amber)}
.card{position:absolute;width:262px;height:300px;top:230px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:16px;padding:26px 22px}
.card .ic{width:46px;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.card .ic svg{width:24px;height:24px;stroke:#e9d9b0;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-size:22px;font-weight:600;margin-bottom:8px}
.card p{font-size:14.5px;line-height:1.5;color:#cfd8cf;min-height:88px}
.card em{font-style:normal;font-weight:600;font-size:14px;color:#ef8a73;display:block;margin-top:14px}
.tag{display:inline-block;background:var(--g8);color:#f6f3ea;font-weight:600;font-size:13px;letter-spacing:.08em;padding:7px 14px;border-radius:7px}
.ft h1{font-size:36px;margin:22px 0 16px}
.ft p{font-size:18px;line-height:1.55;color:var(--mute)}
.shotcard{position:absolute;left:490px;top:133px;width:760px;height:453px;border-radius:12px;background:#fff;box-shadow:0 30px 70px -20px rgba(29,58,44,.5),0 0 0 1px rgba(29,58,44,.14)}
.ph{position:absolute;left:855px;top:40px;width:304px;height:640px;border-radius:38px;background:#16201a;padding:10px;box-shadow:0 30px 60px -18px rgba(0,0,0,.55)}
.ph div{position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:#fff}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:none}
.step{position:absolute;left:560px;top:620px;font-size:15px;color:var(--mute)}
.node{position:absolute;width:190px;text-align:center;font-size:15px;font-weight:600}
.node .b{width:84px;height:84px;margin:0 auto 10px;border-radius:20px;background:#fff;box-shadow:0 10px 26px -10px rgba(29,58,44,.45);display:flex;align-items:center;justify-content:center}
.node svg{width:42px;height:42px;stroke:var(--g8);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node small{display:block;font-weight:400;color:var(--mute);font-size:12.5px;margin-top:2px}
.chk{font-size:19px;line-height:1;display:flex;align-items:center;gap:14px;margin:0 0 17px}
.chk i{width:22px;height:22px;border-radius:50%;background:var(--amber);display:inline-block;position:relative;flex:none}
.chk i:after{content:'';position:absolute;left:7px;top:4px;width:5px;height:10px;border:solid #1d3a2c;border-width:0 2.4px 2.4px 0;transform:rotate(40deg)}
.contact{position:absolute;left:760px;top:300px;width:420px;background:#f6f3ea;color:var(--ink);border-radius:18px;padding:30px 34px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.contact small{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--g6)}
.contact .n{font-size:34px;font-weight:600;letter-spacing:-.01em;margin:10px 0 8px}
.contact .c{font-size:17px;font-weight:600}
.contact .m{font-size:15.5px;color:var(--mute);margin-top:4px}
.bi{position:absolute;left:560px;width:620px;background:#fff;border-radius:14px;padding:18px 24px;font-size:20px;font-weight:500;box-shadow:0 14px 34px -16px rgba(29,58,44,.4);display:flex;align-items:center;gap:16px}
.bi i{width:26px;height:26px;border-radius:50%;background:var(--amber);flex:none;position:relative}
.bi i:after{content:'';position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid #1d3a2c;border-width:0 2.6px 2.6px 0;transform:rotate(40deg)}
</style></head><body>
<div id="root"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const ei=x=>{x=clamp(x);return x*x*(3-2*x)};
const $=id=>document.getElementById(id);
const root=$('root');
const items=['Producteurs, parcelles et cartographie','Achats, pesées et convois','Caisse, comptes des délégués et finances','Stocks, lots et ventes','Rapports et espace exportateur','Téléphone sans réseau, portail, Windows et macOS'];
const SVG={bag:'<path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/>',scale:'<path d="M12 4v16M5 20h14M6 8l-3 7h6L6 8Zm12 0-3 7h6l-3-7Z"/><path d="M6 8h12"/>',cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',pin:'<path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10Z"/><circle cx="12" cy="11" r="2"/>'};
const html={
 hook:s=>`<h1 class="abs" id="h" style="left:110px;top:240px;width:1060px;font-size:66px">Votre coopérative perd <span style="white-space:nowrap">peut-être</span> de l’argent <span class="amber">chaque jour.</span></h1>`,
 pain:s=>`<h1 class="abs" style="left:110px;top:110px;font-size:40px">Ce qui coûte cher, sans bruit :</h1>`+[['bag','Les sacs','Achetés au village, jamais retrouvés au magasin.','– poids perdu'],['scale','Les pesées','Poids annoncé, poids reçu : personne ne compare.','– écarts non suivis'],['cash','Les avances','Aux délégués, notées dans un cahier, puis oubliées.','– créances perdues'],['pin','L’origine','Un acheteur demande d’où vient le lot : pas de réponse.','– marché perdu']].map((c,k)=>`<div class="card pc" style="left:${110+k*284}px"><div class="ic"><svg viewBox="0 0 24 24">${SVG[c[0]]}</svg></div><b>${c[1]}</b><p>${c[2]}</p><em>${c[3]}</em></div>`).join(''),
 logo:s=>`<div class="abs" style="left:0;width:1280px;top:180px;text-align:center"><img id="ll" src="logo.png" style="width:600px"><div id="lt" style="font-size:24px;color:var(--mute);margin-top:26px">Gestion agricole, traçabilité et finances des coopératives</div><div id="lr" style="width:90px;height:3px;background:var(--amber);margin:26px auto 0"></div></div>`,
 live:s=>`<div class="abs ft" id="tx" style="left:70px;top:200px;width:390px"><span class="tag">${s.tag}</span><h1>${s.title}</h1><p>${s.text}</p></div><div class="shotcard" id="sc"></div>`,
 phones:s=>{const fr=frames(s);return `<div class="abs ft" id="tx" style="left:70px;top:200px;width:430px"><span class="tag">${s.tag}</span><h1>${s.title}</h1><p>${s.text}</p></div><div class="ph" id="ph"><div>${fr.map((f,k)=>`<img id="${s.id}_${k}" src="${f}">`).join('')}</div></div>`},
 bul:s=>`<div class="abs ft" id="tx" style="left:70px;top:220px;width:430px"><span class="tag">${s.tag}</span><h1>${s.title}</h1></div>`+s.items.map((t,k)=>`<div class="bi bit" style="top:${140+k*92}px"><i></i>${t}</div>`).join(''),
 net:s=>`<div class="abs ft" id="tx" style="left:70px;top:230px;width:400px"><span class="tag">PARTOUT</span><h1>Un seul outil, sur tous vos postes</h1><p>Le téléphone travaille sans réseau et se synchronise ensuite. Le portail s’ouvre dans un navigateur, et sur Windows ou macOS.</p></div><svg class="abs" style="left:0;top:0" width="1280" height="720" id="nl">${[[845,344,715,188],[845,344,1075,188],[845,344,715,490],[845,344,1075,490]].map((l,k)=>`<line class="nline" x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="#c4a25f" stroke-width="2" stroke-dasharray="6 7"/>`).join('')}</svg>
 <div class="node nn" style="left:750px;top:290px"><div class="b" style="width:108px;height:108px;background:var(--g8)"><svg viewBox="0 0 24 24" style="stroke:#f6f3ea;width:54px;height:54px"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></div>AgriTrace<small>le serveur de la coopérative</small></div>
 <div class="node nn" style="left:620px;top:96px"><div class="b"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg></div>Téléphone Android<small>achats, parcelles, stock</small></div>
 <div class="node nn" style="left:980px;top:96px"><div class="b"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></div>Portail web<small>dans un navigateur</small></div>
 <div class="node nn" style="left:620px;top:490px"><div class="b"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M2 20h20"/></svg></div>Windows et macOS<small>installation sur le poste</small></div>
 <div class="node nn" style="left:980px;top:490px"><div class="b"><svg viewBox="0 0 24 24"><path d="M3 17V8l9-4 9 4v9M3 17h18M8 17v-5h8v5"/></svg></div>Exportateur<small>livraisons et résultats</small></div>`,
 end:s=>`<div class="abs" id="ea" style="left:100px;top:84px;width:620px"><div style="background:#f6f3ea;border-radius:14px;padding:12px 22px;display:inline-block"><img src="logo.png" style="width:250px;display:block"></div><h1 style="font-size:35px;margin:26px 0 30px;line-height:1.2">Gardez le contrôle de chaque sac et de chaque franc.</h1>${items.map(t=>`<div class="chk ck"><i></i>${t}</div>`).join('')}</div><div class="contact" id="ec"><small>CONTACT</small><div class="n">05 05 05 45 63</div><div class="c">Dominique N’Guessan, créateur</div><div class="m">dominiquenguessan414@gmail.com</div></div>`
};
function frames(s){return s.seq.flatMap(n=>Array.from({length:SEQ[n]},(_,k)=>`seq/${n}/${String(k).padStart(2,'0')}.png`));}
SCENES.forEach((s,i)=>{const e=document.createElement('section');e.className='sc '+(['hook','pain','end'].includes(s.kind)?'dark':'light');e.id='S'+i;e.innerHTML=html[s.kind](s);root.appendChild(e);});
function render(t){
 SCENES.forEach((s,i)=>{
  const e=$('S'+i); const a=s.start-0.0,b=s.end; const u=t-s.start;
  if(t<a-.05||t>b+.05){e.style.display='none';return}
  e.style.display='block';
  const fi=ei(u/.45), fo=ei((b-t)/.45); e.style.opacity=Math.min(fi,fo);
  const q=(sel)=>e.querySelectorAll(sel);
  if(s.kind==='hook'){const h=e.querySelector('#h');const v=eo(u/.9);h.style.opacity=v;h.style.transform=`translateY(${(1-v)*18}px)`}
  if(s.kind==='pain'){const step=(s.voice-2.2)/4;q('.pc').forEach((c,k)=>{const v=eo((u-.8-k*step)/.6);c.style.opacity=v;c.style.transform=`translateY(${(1-v)*24}px)`})}
  if(s.kind==='logo'){const l=e.querySelector('#ll');l.style.opacity=eo(u/.7);l.style.transform=`scale(${.94+.06*eo(u/1.2)})`;e.querySelector('#lt').style.opacity=eo((u-.9)/.6);e.querySelector('#lr').style.opacity=eo((u-1.3)/.5)}
  if(s.kind==='live'){const tx=e.querySelector('#tx');const v=eo((u-.3)/.6);tx.style.opacity=v;tx.style.transform=`translateX(${(1-v)*-26}px)`;const c=e.querySelector('#sc');const w=eo((u-.3)/.6);c.style.opacity=w;c.style.transform=`translateY(${(1-w)*26}px)`}
  if(s.kind==='phones'){const tx=e.querySelector('#tx');const v=eo((u-.3)/.6);tx.style.opacity=v;tx.style.transform=`translateX(${(1-v)*-26}px)`;
    const ph=e.querySelector('#ph');const w=eo((u-.3)/.7);ph.style.opacity=w;ph.style.transform=`translateY(${(1-w)*30}px)`;
    const fr=frames(s);const t0=1.0,t1=s.dur-1.0;const k=Math.min(fr.length-1,Math.max(0,Math.floor((u-t0)/(t1-t0)*fr.length)));
    fr.forEach((f,j)=>{const im=document.getElementById(s.id+'_'+j);im.style.display=(j===k)?'block':'none'})}
  if(s.kind==='bul'){const tx=e.querySelector('#tx');const v=eo((u-.3)/.6);tx.style.opacity=v;tx.style.transform=`translateX(${(1-v)*-26}px)`;const step=(s.voice-2)/s.items.length;q('.bit').forEach((c,k)=>{const w=eo((u-1-k*step)/.6);c.style.opacity=w;c.style.transform=`translateX(${(1-w)*40}px)`})}
  if(s.kind==='net'){const tx=e.querySelector('#tx');const v=eo((u-.3)/.6);tx.style.opacity=v;q('.nn').forEach((n,k)=>{const w=eo((u-.5-k*.5)/.6);n.style.opacity=w;n.style.transform=`scale(${.9+.1*w})`});q('.nline').forEach((l,k)=>l.style.opacity=eo((u-1-k*.5)/.6))}
  if(s.kind==='end'){e.querySelector('#ea').style.opacity=eo(u/.7);q('.ck').forEach((c,k)=>{const w=eo((u-1.5-k*.6)/.5);c.style.opacity=w;c.style.transform=`translateX(${(1-w)*-16}px)`});const cv=eo((u-(s.voice-6))/.8);const ec=e.querySelector('#ec');ec.style.opacity=cv;ec.style.transform=`translateY(${(1-cv)*24}px)`}
 });
}
window.render=render;render(0);
</script></body></html>
